<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyper Twitch</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup-shell" id="app">
      <header class="popup-header">
        <div aria-hidden="true" class="brand-mark">H</div>
        <div>
          <h1>Hyper Twitch</h1>
          <p class="tagline">A better player, on your terms.</p>
        </div>
      </header>

      <section aria-label="Feature settings" class="features" id="features">
        <div class="feature-list" id="feature-list"></div>
        <div class="empty-state" id="empty-state">
          <h3>No enhancements available</h3>
          <p>New controls will appear here when they are ready.</p>
        </div>
      </section>

      <footer class="popup-footer">
        <span aria-hidden="true" class="status-dot"></span>
        <p class="status" id="status" role="status">Changes apply instantly in this browser.</p>
      </footer>
    </main>
    <script src="./main.ts" type="module"></script>
  </body>
</html>
